{% extends "base.html" %}

{% block main_content %}
<h1>Join</h1>

<form method="post" action="{{ url_for('join') }}">
  <p>
    <label><input type="radio" name="account_type" value="business" required> Business</label>
    <label><input type="radio" name="account_type" value="customer"> Customer</label>
  </p>
  <p><label>Username <input type="text" name="username" maxlength="50" required></label></p>
  <p><label>Email <input type="email" name="email" maxlength="250"></label></p>
  <p><label>Password <input type="password" name="password1" required></label></p>
  <p><label>Password again <input type="password" name="password2" required></label></p>
  <p><label>Business name (businesses only) <input type="text" name="business_name" maxlength="100"></label></p>
  <p><input type="submit" value="Join"></p>
</form>

<p>Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
{% endblock %}
