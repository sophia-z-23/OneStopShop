{% extends "base.html" %}

{% block main_content %}
<h1>New Posting</h1>

<!-- enctype is required, or request.files will be empty -->
<form method="post" action="{{ url_for('new_post') }}" enctype="multipart/form-data">
  <p>
    <label><input type="radio" name="post_type" value="item" required> Item</label>
    <label><input type="radio" name="post_type" value="scheduling"> Service (with hours)</label>
  </p>
  <p><label>Title <input type="text" name="title" required></label></p>
  <p><label>Price ($) <input type="number" name="price" min="0" step="0.01"></label></p>
  <p><label>Description <textarea name="description" maxlength="500"></textarea></label></p>
  <p><label>Image (optional) <input type="file" name="pic" accept="image/png, image/jpeg, image/gif"></label></p>

  <fieldset>
    <legend>Time slot (services only)</legend>
    <label>From <input type="datetime-local" name="start_time"></label>
    <label>To <input type="datetime-local" name="end_time"></label>
  </fieldset>

  <p><input type="submit" value="Upload"></p>
</form>
{% endblock %}
