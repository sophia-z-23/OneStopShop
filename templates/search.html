{% extends "base.html" %}

{% block main_content %}
<nav>
  <ul>
    <li><a href="{{url_for('index')}}">Dashboard</a></li>
  </ul>
</nav>

<form action="{{ url_for('search') }}" method="GET">
    <input type="text" name="search-bname" placeholder="Enter business name">
    <button type="submit">Search</button>
</form>

{% if businesses %}
  <h2>Search Results</h2>
  <p>These are your search results.</p>

  <ul>
    {% for business in businesses %}
    <li><a class="link" href="/getProfile/{{ business.business_name }}">{{ business.business_name }}</a></li>
    {% endfor %}
  </ul>
{% endif %}

{% endblock %}
